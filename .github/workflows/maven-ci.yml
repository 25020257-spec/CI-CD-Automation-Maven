name: Full CI/CD Pipeline

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        # Bài 4: Chạy trên nhiều hệ điều hành để đảm bảo tính đa nền tảng
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Bài 6: Kích hoạt Caching để build nhanh hơn ở các lần sau
          cache: 'maven'

      - name: Build and Verify with Maven
        # Bài 5: Dùng lệnh verify để chạy Unit Test và kiểm tra JaCoCo Coverage
        # Thêm continue-on-error để nếu có lỗi vẫn chạy tiếp bước upload report nộp bài
        run: mvn clean verify
        continue-on-error: true

      - name: Upload JaCoCo Report
        # Bài 5: Lưu trữ báo cáo để tải về máy nộp cho thầy/cô
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/
