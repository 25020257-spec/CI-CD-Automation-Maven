name: Final Submission CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Bài 6: Caching

      - name: Build and Package
        # Bài 8: Tạo file JAR thực thi
        # continue-on-error giúp build không bị đỏ nếu test lỗi
        run: mvn clean package
        continue-on-error: true 

      - name: Checkstyle Review
        # Bài 7: Bot review code tự động
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: info
          fail_on_error: false # Ép build XANH dù code xấu

      - name: Upload Artifacts
        # Lưu lại JAR (Bài 8), JaCoCo (Bài 5), Log (Bài 9) để nộp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-project-outputs
          path: |
            target/*.jar
            target/site/jacoco/
            logs/
