name: Java CI with JaCoCo

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build and Verify Coverage
        # verify sẽ chạy cả test, report và check coverage
        run: mvn clean verify

      - name: Upload JaCoCo Report
        # Lưu báo cáo để xem sau (yêu cầu đề bài)
        if: always() # Luôn chạy kể cả khi build fail để xem tại sao thiếu coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
