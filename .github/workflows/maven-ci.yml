name: Full CI CD Pipeline Optimization and Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ] # Bài 7: Kích hoạt khi tạo Pull Request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Bài 6: Tối ưu hóa tốc độ bằng Caching
          cache: 'maven'

      - name: Build and Verify
        # Chạy test, đóng gói JAR và đo độ bao phủ code
        run: mvn clean verify
        continue-on-error: true 

      - name: Automated Code Review
        # Bài 7: Bot tự động bình luận lỗi Checkstyle vào Pull Request
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning

      - name: Upload JaCoCo Report
        # Bài 5: Lưu lại báo cáo để tải về nộp bài
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
