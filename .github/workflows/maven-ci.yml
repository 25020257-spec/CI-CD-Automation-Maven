name: Matrix Build CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        # Chạy song song trên 3 hệ điều hành (Yêu cầu Bài 4)
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build and Test with Maven
        run: mvn -B package
