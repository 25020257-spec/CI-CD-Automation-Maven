name: Final Full CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Package
        # Lenh nay tao file JAR cho Bai 8
        run: mvn clean package
        continue-on-error: true 

      - name: Checkstyle Review
        # Bai 7: Bot review tu dong
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: info
          fail_on_error: false 

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-submission-files
          path: |
            target/*.jar
            target/site/jacoco/
            logs/
